        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #0A0F0A;
            color: #F9E1DC;
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* Royal Olive Deep Radial Ambient Background */
        .royal-olive-bg {
            background:
                radial-gradient(circle at 50% 44%, rgba(58, 83, 56, 0.34) 0%, rgba(26, 39, 25, 0.72) 44%, rgba(10, 15, 10, 0.98) 100%),
                linear-gradient(135deg, #0A0F0A 0%, #141E14 50%, #090D09 100%);
        }

        /* Metallic Gold & Rose Gold Shimmer Text */
        .gold-shimmer-text {
            background: linear-gradient(110deg, #D4AF37 0%, #FFF3C4 28%, #E0A39A 52%, #F6D365 76%, #D4AF37 100%);
            background-size: 220% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmerFlow 5.5s linear infinite;
        }

        @keyframes shimmerFlow {
            0% { background-position: 0% center; }
            100% { background-position: 220% center; }
        }

        /* 3D Carousel Stage */
        .carousel-viewport {
            perspective: 2200px;
            perspective-origin: 50% 48%;
            transform-style: preserve-3d;
        }

        .carousel-cylinder {
            position: relative;
            width: min(650px, 84vw);
            height: 1px;
            transform-style: preserve-3d;
            transition: transform 0.72s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform;
        }

        /* Individual 3D Wheel Slide Card */
        .wheel-card {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            transform: translateY(-50%);
            margin-top: -228px;
            transform-style: preserve-3d;
            backface-visibility: visible;
            transition:
                transform 0.65s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.55s ease,
                border-color 0.4s ease,
                box-shadow 0.45s ease;
            will-change: transform, opacity;
        }

        @media (max-width: 639px) {
            .wheel-card {
                margin-top: -195px;
            }
        }

        /* Royal Olive Glass Surface + Luminous Golden Boundary */
        .olive-glass-card {
            background: linear-gradient(155deg, rgba(31, 47, 30, 0.96) 0%, rgba(16, 24, 16, 0.98) 100%);
            border: 1.5px solid rgba(212, 175, 55, 0.45);
            box-shadow:
                0 22px 52px -12px rgba(0, 0, 0, 0.85),
                0 0 24px -4px rgba(212, 175, 55, 0.16),
                inset 0 1px 1px 0 rgba(255, 243, 196, 0.18);
        }

        .olive-glass-card.is-active {
            border-color: #F6D365;
            box-shadow:
                0 30px 68px -12px rgba(0, 0, 0, 0.94),
                0 0 46px 0 rgba(212, 175, 55, 0.36),
                inset 0 1px 2px 0 rgba(255, 243, 196, 0.45);
        }

        .olive-glass-card.is-expanded {
            border-color: #FFF3C4;
            box-shadow:
                0 36px 84px -10px rgba(0, 0, 0, 0.98),
                0 0 68px 4px rgba(246, 211, 101, 0.58),
                inset 0 1px 2px 0 rgba(255, 248, 220, 0.78);
        }

        /* Backside Card Face when Revolving Across Rear Arc */
        .card-front-face {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .card-back-face {
            position: absolute;
            inset: 0;
            border-radius: 1rem;
            background: linear-gradient(145deg, rgba(22, 33, 21, 0.94) 0%, rgba(12, 18, 12, 0.96) 100%);
            border: 1.5px solid rgba(212, 175, 55, 0.42);
            transform: rotateY(180deg);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        /* Word-by-Word Left-to-Right Reveal on Active Slide */
        .word-reveal {
            display: inline-block;
            opacity: 0;
            transform: translateX(-16px);
            transition:
                opacity 0.72s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.72s cubic-bezier(0.22, 1, 0.36, 1);
            transition-delay: var(--word-delay, 0ms);
        }

        .wheel-card.is-active .word-reveal {
            opacity: 1;
            transform: translateX(0);
        }

        /* Custom Thin Scrollbars */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .terminal-scroll::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .terminal-scroll::-webkit-scrollbar-track {
            background: rgba(10, 15, 10, 0.6);
        }
        .terminal-scroll::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.45);
            border-radius: 9999px;
        }

        /* Signature Crest Glow */
        .signature-crest {
            background: linear-gradient(135deg, rgba(26, 39, 25, 0.92) 0%, rgba(14, 21, 14, 0.96) 100%);
            border: 1px solid rgba(212, 175, 55, 0.52);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.65), 0 0 18px rgba(212, 175, 55, 0.18);
        }
    </style>
</head>

        // =========================================================================

        const totalSteps = UPDATE_STEPS.length;

        const STREAM_STEP_DURATION = 4800; // ms per slide

        // Wrap words in individual spans for left-to-right staggered reveal
        function wrapWordsForReveal(text, startWordIndex = 0) {
            return text.split(/\s+/).map((word, idx) => {
                const delay = (startWordIndex + idx) * 75;
                return `<span class="word-reveal" style="--word-delay:${delay}ms">${escapeHtml(word)}</span>`;
            }).join(' ');
        }

        // Escape HTML safely
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // Compute 3D Cylinder Radius so adjacent cards never overlap
        function getCylinderRadius() {
            const w = window.innerWidth;
            if (w < 640) return 680;
            if (w < 1024) return 1040;
            return 1320;
        }

        // Compute Adaptive Scale Factor so Cards & Zoomed State Fit Cleanly Above Footer on Laptops
        function getResponsiveStageScale() {
            const stage = document.getElementById('carousel-stage');
            const availableHeight = stage ? stage.clientHeight : (window.innerHeight - 130);
            const availableWidth = stage ? stage.clientWidth : window.innerWidth;

            const activeCard = document.querySelector('.wheel-card.is-active') || document.querySelector('.wheel-card');
            const naturalCardHeight = activeCard ? activeCard.offsetHeight : (window.innerWidth < 640 ? 395 : 455);
            const naturalCardWidth = activeCard ? activeCard.offsetWidth : Math.min(650, availableWidth * 0.84);

            const zoomPadding = expandedIndex !== null ? 1.15 : 1.0;
            const heightScale = (availableHeight - 20) / Math.max(310, naturalCardHeight * zoomPadding);
            const widthScale = (availableWidth - 96) / Math.max(300, naturalCardWidth * zoomPadding);

            return Math.max(0.62, Math.min(1.16, heightScale, widthScale));
        }

        // Toggle enlarge/zoom on an individual slide
        function toggleExpandCard(index) {

                        <!-- Terminal / Screenshot Viewport -->

        // Update 3D Cylindrical Positions, Click-Enlarge State & Backside Visibility
        function updateWheelTransforms() {
            const wheel = document.getElementById('carousel-wheel');
            const cards = document.querySelectorAll('.wheel-card');
            const dots = document.querySelectorAll('.step-dot');
            const counter = document.getElementById('step-counter');
            if (!wheel || !cards.length) return;

            const radius = getCylinderRadius();
            const stageScale = getResponsiveStageScale();
            wheel.style.transform = `translateZ(${-radius}px) rotateX(-2.2deg) rotateY(${currentRotation}deg) scale(${stageScale})`;

            const normalizedAngle = (((-currentRotation) % 360) + 360) % 360;
            activeIndex = Math.round(normalizedAngle / theta) % totalSteps;

            if (expandedIndex !== null && expandedIndex !== activeIndex) {
                expandedIndex = null;
            }

            if (counter) counter.textContent = String(activeIndex + 1).padStart(2, '0');

            cards.forEach((card, idx) => {
                const cardAngle = idx * theta;
                const relAngle = (((cardAngle + currentRotation) % 360) + 540) % 360 - 180;
                const absAngle = Math.abs(relAngle);
                const isFront = idx === activeIndex && absAngle < (theta * 0.6);
                const isBackside = absAngle > 95;
                const isExpanded = isFront && expandedIndex === idx;

                card.classList.toggle('is-active', isFront);
                card.classList.toggle('is-backside', isBackside);
                card.classList.toggle('is-expanded', isExpanded);

                const zoomBadge = card.querySelector('.zoom-badge');
                if (zoomBadge) zoomBadge.classList.toggle('hidden', !isExpanded);

                const depthT = Math.cos((relAngle * Math.PI) / 180);
                let cardScale = 0.86 + Math.max(0, depthT) * 0.14;
                let extraZ = 0;

                if (isExpanded) {
                    cardScale = 1.15;
                    extraZ = 95;
                } else if (expandedIndex !== null) {
                    cardScale *= 0.88;
                }

                card.style.transform = `rotateY(${cardAngle}deg) translateZ(${radius + extraZ}px) scale(${cardScale.toFixed(3)})`;
                card.style.zIndex = isExpanded ? '200' : String(Math.round((depthT + 1) * 50));

                if (isFront) {
                    card.style.opacity = '1';
                    card.style.pointerEvents = 'auto';
                } else if (isBackside) {
                    card.style.opacity = expandedIndex !== null ? '0.16' : '0.32';
                    card.style.pointerEvents = 'none';
                } else {
                    const baseSideOpacity = Math.max(0.42, 1 - (absAngle / 115) * 0.55);
                    card.style.opacity = (expandedIndex !== null ? baseSideOpacity * 0.6 : baseSideOpacity).toFixed(2);
                    card.style.pointerEvents = 'auto';
                }
            });

            dots.forEach((dot, idx) => {
                if (idx === activeIndex) {
                    dot.className = 'step-dot h-2.5 w-8 rounded-full bg-gold-light shadow-[0_0_12px_rgba(246,211,101,0.9)] transition-all duration-300';
                } else {
                    dot.className = 'step-dot h-2.5 w-2.5 rounded-full bg-gold-main/30 hover:bg-gold-main/70 transition-all duration-300';
                }
            });

            refreshCachedRects();
        }

        // Rotate Wheel by Relative Step (+1 or -1)
        function stepWheel(dir) {
            if (expandedIndex !== null && expandedIndex !== ((activeIndex + dir + totalSteps) % totalSteps)) {
                expandedIndex = null;
            }
            currentRotation -= dir * theta;
            updateWheelTransforms();
            if (isStreaming) streamProgress = 0;
        }

        // Rotate Wheel Directly to Target Step Index
        function goToStep(targetIndex) {
            const currentStepFloat = -currentRotation / theta;
            const currentMod = ((Math.round(currentStepFloat) % totalSteps) + totalSteps) % totalSteps;
            let diff = targetIndex - currentMod;
            if (diff > totalSteps / 2) diff -= totalSteps;
            if (diff < -totalSteps / 2) diff += totalSteps;

            currentRotation -= diff * theta;
            updateWheelTransforms();
            if (isStreaming) streamProgress = 0;
        }

        // =========================================================================
        // 3. MOUSE WHEEL, SIDEWAYS DRAG, KEYBOARD & STAGE INTERACTIONS
        // =========================================================================
        function initWheelAndDragControls() {
            const stage = document.getElementById('carousel-stage');
            const wheel = document.getElementById('carousel-wheel');
            if (!stage || !wheel) return;

            let wheelCooldown = false;
            stage.addEventListener('wheel', (e) => {
                e.preventDefault();
                if (wheelCooldown) return;
                const delta = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
                if (Math.abs(delta) < 8) return;
                stepWheel(delta > 0 ? 1 : -1);
                wheelCooldown = true;
                setTimeout(() => { wheelCooldown = false; }, 260);
            }, { passive: false });

            let isDragging = false;
            let startX = 0;
            let dragMoved = false;
            let startRotation = 0;

            const onPointerDown = (clientX, target) => {
                if (target && target.closest('button')) return;
                isDragging = true;
                dragMoved = false;
                startX = clientX;
                startRotation = currentRotation;
                wheel.style.transition = 'none';
            };

            const onPointerMove = (clientX) => {
                if (!isDragging) return;
                const deltaX = clientX - startX;
                if (Math.abs(deltaX) > 6) {
                    dragMoved = true;
                    if (expandedIndex !== null) expandedIndex = null;
                }
                if (dragMoved) {
                    currentRotation = startRotation + deltaX * 0.24;
                    updateWheelTransforms();
                }
            };

            const onPointerUp = () => {
                if (!isDragging) return;
                isDragging = false;
                wheel.style.transition = 'transform 0.72s cubic-bezier(0.22, 1, 0.36, 1)';
                if (dragMoved) {
                    hasDraggedRecently = true;
                    setTimeout(() => { hasDraggedRecently = false; }, 120);
                    currentRotation = Math.round(currentRotation / theta) * theta;
                    updateWheelTransforms();
                    if (isStreaming) streamProgress = 0;
                }
            };

            stage.addEventListener('mousedown', (e) => onPointerDown(e.clientX, e.target));
            window.addEventListener('mousemove', (e) => onPointerMove(e.clientX));
            window.addEventListener('mouseup', onPointerUp);

            stage.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) onPointerDown(e.touches[0].clientX, e.target);
            }, { passive: true });
            window.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1) onPointerMove(e.touches[0].clientX);
            }, { passive: true });
            window.addEventListener('touchend', onPointerUp);

            // Keyboard Left/Right Arrows & Escape to restore zoomed slide
            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight') stepWheel(1);
                else if (e.key === 'ArrowLeft') stepWheel(-1);
                else if (e.key === 'Escape' && expandedIndex !== null) {
                    expandedIndex = null;
                    updateWheelTransforms();
                }
            });

            // Clicking empty background restores zoomed slide
            stage.addEventListener('click', (e) => {
                if (hasDraggedRecently) return;
                if (!e.target.closest('.wheel-card') && !e.target.closest('button') && expandedIndex !== null) {
                    expandedIndex = null;
                    updateWheelTransforms();
                }
            });

            window.addEventListener('resize', updateWheelTransforms);
        }

        // =========================================================================
        // 4. LIVE STREAM AUTO-PLAY, SHARE LINK, COPY & REPORT DOWNLOAD
        // =========================================================================
        function toggleStreamMode(forceState = null) {
            isStreaming = forceState !== null ? forceState : !isStreaming;
            const label = document.getElementById('stream-label');
            const icon = document.getElementById('stream-icon');
            const progressBar = document.getElementById('stream-progress-bar');

            if (isStreaming) {
                if (label) label.textContent = 'Streaming';
                if (icon) icon.setAttribute('data-lucide', 'pause');
                if (window.lucide) lucide.createIcons();
                streamProgress = 0;
                clearInterval(streamInterval);
                streamInterval = setInterval(() => {
                    streamProgress += 100;
                    const pct = Math.min(100, (streamProgress / STREAM_STEP_DURATION) * 100);
                    if (progressBar) progressBar.style.width = `${pct}%`;
                    if (streamProgress >= STREAM_STEP_DURATION) {
                        streamProgress = 0;
                        stepWheel(1);
                    }
                }, 100);
                showToast('Live Stream mode started — auto-advancing steps');
            } else {
                if (label) label.textContent = 'Stream';
                if (icon) icon.setAttribute('data-lucide', 'play');
                if (window.lucide) lucide.createIcons();
                clearInterval(streamInterval);
                if (progressBar) progressBar.style.width = '0%';
            }
        }

        function copyShareStreamLink() {
            const url = new URL(window.location.href);
            url.searchParams.set('stream', '1');
            url.searchParams.set('step', String(activeIndex + 1));
            const shareUrl = url.toString();

            copyTextFallback(shareUrl);
            if (shareUrl.startsWith('http')) {
                showToast(`Stream link copied: Step ${activeIndex + 1}`);
            } else {
                showToast('Stream URL copied! Click Download to export standalone HTML.');
            }
        }

        function copyStepCommand(idx, event) {
            if (event) event.stopPropagation();
            const cmd = UPDATE_STEPS[idx].command;
            copyTextFallback(cmd);
            showToast(`Copied: ${cmd}`);
        }

        function copyTextFallback(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
            } catch (e) {
                // Ignore if clipboard blocked
            }
            document.body.removeChild(ta);
        }

        // Attach Custom Screenshot Image to Any Card
        function triggerCardImageUpload(idx, event) {
            if (event) event.stopPropagation();
            pendingUploadIndex = idx;
            const input = document.getElementById('card-image-input');
            if (input) input.click();
        }

        document.getElementById('card-image-input').addEventListener('change', function (e) {
            const file = e.target.files && e.target.files[0];
            if (!file || pendingUploadIndex === null) return;
            const reader = new FileReader();
            reader.onload = function (ev) {
                customImages[pendingUploadIndex] = ev.target.result;
                renderWheel();
                showToast(`Attached screenshot to Step ${String(pendingUploadIndex + 1).padStart(2, '0')}`);
                pendingUploadIndex = null;
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        });

        // Download Self-Contained Royal Olive & Gold Audit Report
        function downloadStandaloneReport() {
            const rowsHtml = UPDATE_STEPS.map(step => `
                <div style="background:#162216;border:1px solid #D4AF37;border-radius:14px;padding:18px;margin-bottom:16px;">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                        <span style="color:#F6D365;font-family:monospace;font-weight:bold;">STEP ${step.num} • ${escapeHtml(step.phase)}</span>
                        <span style="color:#E0A39A;font-family:monospace;font-size:12px;">${step.time}</span>
                    </div>
                    <h3 style="margin:0 0 6px 0;color:#F9E1DC;font-size:18px;">${escapeHtml(step.title)}</h3>
                    <p style="margin:0 0 10px 0;color:#F2C6BE;font-size:14px;line-height:1.5;">${escapeHtml(step.shortDesc)}</p>
                    <div style="background:#090D12;border:1px solid rgba(212,175,55,0.45);border-radius:8px;padding:10px 12px;font-family:monospace;color:#F6D365;font-size:13px;">
                        $ ${escapeHtml(step.command)}
                    </div>
                </div>
            `).join('');

            const reportHtml = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Linux Security Update Check — Audit Report by Abhay Gupta</title>
</head>
<body style="background:#0A0F0A;color:#F9E1DC;font-family:system-ui,-apple-system,sans-serif;max-width:860px;margin:0 auto;padding:32px 20px;">
    <div style="border-bottom:1px solid #D4AF37;padding-bottom:18px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;">
        <div>
            <div style="color:#F6D365;font-family:monospace;font-size:12px;letter-spacing:2px;">KALI-ROLLING SECURITY AUDIT</div>
            <h1 style="margin:4px 0 0 0;color:#FFF3C4;font-size:28px;">Linux Security Update Check</h1>
        </div>
        <div style="color:#E0A39A;font-family:monospace;font-size:13px;">Crafted by <strong style="color:#F6D365;">Abhay Gupta</strong></div>
    </div>
    ${rowsHtml}
</body>
</html>`;

            const blob = new Blob([reportHtml], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Linux-Security-Update-Check-Report.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('Downloaded Linux-Security-Update-Check-Report.html');
        }

        // Show Toast Banner
        let toastTimeout = null;
        function showToast(msg) {
            const banner = document.getElementById('toast-banner');
            const text = document.getElementById('toast-message');
            if (!banner || !text) return;
            text.textContent = msg;
            banner.classList.remove('opacity-0', 'translate-y-3');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                banner.classList.add('opacity-0', 'translate-y-3');
            }, 2800);
        }

        // =========================================================================
        // 5. OPTIMIZED GOLDEN DUST WAVE & BOUNDARY-SUMMONED SYMBOLS CANVAS
        // =========================================================================
        let cachedActiveRect = null;
        let lastRectMeasureTime = 0;

        function refreshCachedRects() {
            const activeCard = document.querySelector('.wheel-card.is-active');
            if (activeCard) {
                const r = activeCard.getBoundingClientRect();
                if (r.width > 40 && r.height > 40) {
                    cachedActiveRect = { left: r.left, top: r.top, right: r.right, bottom: r.bottom, width: r.width, height: r.height };
                }
            }
        }

        function initGoldenWaveCanvas() {
            const canvas = document.getElementById('golden-wave-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
                refreshCachedRects();
            });

            // Pre-render soft golden dust sprite for 60fps rendering
            const spriteSize = 32;
            const dustSprite = document.createElement('canvas');
            dustSprite.width = spriteSize;
            dustSprite.height = spriteSize;
            const sCtx = dustSprite.getContext('2d');
            const grad = sCtx.createRadialGradient(16, 16, 0, 16, 16, 16);
            grad.addColorStop(0, 'rgba(255, 243, 196, 1)');
            grad.addColorStop(0.35, 'rgba(246, 211, 101, 0.75)');
            grad.addColorStop(0.7, 'rgba(212, 175, 55, 0.22)');
            grad.addColorStop(1, 'rgba(212, 175, 55, 0)');
            sCtx.fillStyle = grad;
            sCtx.fillRect(0, 0, spriteSize, spriteSize);

            const SUMMONED_SYMBOLS = [
                '⛨', '⚡', '◈', '✦', '⌘', '⟁', '❖', '⬡',
                'sudo', 'uname -r', 'SHA-256', 'SSL/TLS', '0x7F', 'CVE-PATCH', '[ OK ]', 'initrd'
            ];

            const dustParticles = [];
            const floatingSymbols = [];
            let wavePhase = 0;

            function spawnBoundaryDust(rect) {
                if (!rect || dustParticles.length > 135) return;
                const edge = Math.floor(Math.random() * 4);
                let x, y, vx, vy;
                if (edge === 0) { // top
                    x = rect.left + Math.random() * rect.width;
                    y = rect.top;
                    vx = (Math.random() - 0.5) * 0.9;
                    vy = -0.45 - Math.random() * 0.85;
                } else if (edge === 1) { // right
                    x = rect.right;
                    y = rect.top + Math.random() * rect.height;
                    vx = 0.45 + Math.random() * 0.95;
                    vy = (Math.random() - 0.5) * 0.9;
                } else if (edge === 2) { // bottom
                    x = rect.left + Math.random() * rect.width;
                    y = rect.bottom;
                    vx = (Math.random() - 0.5) * 0.9;
                    vy = 0.45 + Math.random() * 0.85;
                } else { // left
                    x = rect.left;
                    y = rect.top + Math.random() * rect.height;
                    vx = -0.45 - Math.random() * 0.95;
                    vy = (Math.random() - 0.5) * 0.9;
                }

                dustParticles.push({
                    x, y, vx, vy,
                    size: 5 + Math.random() * 11,
                    life: 1,
                    decay: 0.008 + Math.random() * 0.009,
                    wobble: Math.random() * Math.PI * 2
                });
            }

            function spawnBoundarySymbol(rect) {
                if (!rect || floatingSymbols.length >= 20) return;
                const side = Math.random() < 0.5 ? -1 : 1;
                const x = side < 0 ? rect.left - 8 : rect.right + 8;
                const y = rect.top + 20 + Math.random() * Math.max(40, rect.height - 40);
                floatingSymbols.push({
                    text: SUMMONED_SYMBOLS[Math.floor(Math.random() * SUMMONED_SYMBOLS.length)],
                    x,
                    y,
                    vx: side * (0.45 + Math.random() * 0.55),
                    vy: -0.25 - Math.random() * 0.4,
                    life: 1,
                    decay: 0.0045 + Math.random() * 0.0035,
                    phase: Math.random() * Math.PI * 2,
                    isGlyph: Math.random() < 0.52
                });
            }

            function animate(now) {
                ctx.clearRect(0, 0, width, height);

                if (now - lastRectMeasureTime > 240) {
                    refreshCachedRects();
                    lastRectMeasureTime = now;
                }

                wavePhase += 0.025;
                const rect = cachedActiveRect || {
                    left: width * 0.25,
                    right: width * 0.75,
                    top: height * 0.22,
                    bottom: height * 0.78,
                    width: width * 0.5,
                    height: height * 0.56
                };

                // Draw subtle disturbed golden dust wave rings expanding from active box boundary
                for (let w = 0; w < 3; w++) {
                    const progress = ((wavePhase * 0.35 + w * 0.33) % 1);
                    const expand = progress * 68;
                    const alpha = (1 - progress) * 0.16;
                    ctx.save();
                    ctx.strokeStyle = `rgba(246, 211, 101, ${alpha.toFixed(3)})`;
                    ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    const x0 = rect.left - expand;
                    const y0 = rect.top - expand;
                    const rw = rect.width + expand * 2;
                    const rh = rect.height + expand * 2;
                    const perturb = Math.sin(wavePhase * 2 + w) * 4;
                    ctx.roundRect(x0 + perturb, y0 - perturb * 0.5, rw, rh, 22 + expand * 0.3);
                    ctx.stroke();
                    ctx.restore();
                }

                // Emit new golden dust & boundary-summoned commands/symbols
                spawnBoundaryDust(rect);
                spawnBoundaryDust(rect);
                if (Math.random() < 0.085) spawnBoundarySymbol(rect);

                // Update & draw golden dust particles
                for (let i = dustParticles.length - 1; i >= 0; i--) {
                    const p = dustParticles[i];
                    p.wobble += 0.08;
                    p.x += p.vx + Math.sin(p.wobble) * 0.45;
                    p.y += p.vy + Math.cos(p.wobble) * 0.35;
                    p.life -= p.decay;
                    if (p.life <= 0) {
                        dustParticles.splice(i, 1);
                        continue;
                    }
                    ctx.globalAlpha = p.life * 0.85;
                    const half = p.size * 0.5;
                    ctx.drawImage(dustSprite, p.x - half, p.y - half, p.size, p.size);
                }

                // Update & draw boundary-summoned symbols & commands floating away with waves
                ctx.textBaseline = 'middle';
                for (let i = floatingSymbols.length - 1; i >= 0; i--) {
                    const s = floatingSymbols[i];
                    s.phase += 0.05;
                    s.x += s.vx;
                    s.y += s.vy + Math.sin(s.phase) * 0.4;
                    s.life -= s.decay;
                    if (s.life <= 0) {
                        floatingSymbols.splice(i, 1);
                        continue;
                    }
                    ctx.globalAlpha = Math.sin(s.life * Math.PI) * 0.72;
                    ctx.font = s.isGlyph ? '600 14px "JetBrains Mono", monospace' : '500 11px "JetBrains Mono", monospace';
                    ctx.fillStyle = s.isGlyph ? '#F6D365' : '#E0A39A';
                    ctx.fillText(s.text, s.x, s.y);
                }

                ctx.globalAlpha = 1;
                requestAnimationFrame(animate);
            }

            requestAnimationFrame(animate);
        }

        // =========================================================================
        // 6. INITIALIZE APPLICATION & HANDLE URL QUERY PARAMS
        // =========================================================================
        window.addEventListener('DOMContentLoaded', () => {
            renderWheel();
            initWheelAndDragControls();
            initGoldenWaveCanvas();
            if (window.lucide) lucide.createIcons();

            // Support shared stream links (?stream=1&step=N)
            const params = new URLSearchParams(window.location.search);
            const stepParam = parseInt(params.get('step'), 10);
            if (!isNaN(stepParam) && stepParam >= 1 && stepParam <= totalSteps) {
                goToStep(stepParam - 1);
            }
            if (params.get('stream') === '1') {
                setTimeout(() => toggleStreamMode(true), 450);
            }
        });
    </script>
</body>
</html>
